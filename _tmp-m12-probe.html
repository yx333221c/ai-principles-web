<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>m12 layout probe</title>
<link rel="stylesheet" href="./assets/css/base.css">
<link rel="stylesheet" href="./assets/css/layout.css">
<link rel="stylesheet" href="./assets/css/components.css">
<link rel="stylesheet" href="./assets/css/diagram.css">
</head><body data-theme="light">
<div class="demo" id="h" data-demo="m12-agent-timeline">
  <div class="demo__canvas"></div>
  <div class="demo__controls"></div>
</div>
<pre id="R"></pre>
<script src="./assets/js/app.js" defer></script>
<script src="./assets/js/demo-kit.js" defer></script>
<script src="./assets/js/demos/m12-agent-timeline.js" defer></script>
<script>
addEventListener('load', () => {
  const host = document.getElementById('h');
  const inst = window.AIPrinciples.demos['m12-agent-timeline']().mount(host);
  const svg = host.querySelector('svg');
  const VB = inst.api.spec.viewBox;
  const out = [];
  const states = [];
  [0.8, 0.9, 0.95, 0.99].forEach(p => [0, 1, 2].forEach(q => [true, false].forEach(loop => {
    for (let f = 0; f <= 16; f++) states.push([p, q, loop, f]);
  })));
  const boxes = new Map();   // key: element identity -> worst info
  states.forEach(([p, q, loop, f]) => {
    inst.api.state.p = p; inst.api.state.q = q; inst.api.state.loop = loop; inst.api.state.f = f;
    inst.api.draw();
    const ts = [...svg.querySelectorAll('text')].map(t => {
      const b = t.getBBox();
      return { t, x: b.x, y: b.y, w: b.width, h: b.height, r: b.x + b.width, bot: b.y + b.height,
               s: (t.textContent || '').slice(0, 44) };
    }).filter(o => o.w > 0 && o.s.trim());
    ts.forEach(o => {
      const k = o.s;
      const prev = boxes.get(k);
      const rec = { r: o.r, x: o.x, bot: o.bot, y: o.y };
      if (!prev || rec.r > prev.r) boxes.set(k, rec);
    });
    // viewBox overflow
    ts.forEach(o => {
      if (o.r > VB[0] + 0.3) out.push('OVERFLOW-R ' + (o.r - VB[0]).toFixed(1) + 'px  ' + o.s);
      if (o.x < -0.3) out.push('OVERFLOW-L ' + (-o.x).toFixed(1) + 'px  ' + o.s);
      if (o.bot > VB[1] + 0.3) out.push('OVERFLOW-B ' + (o.bot - VB[1]).toFixed(1) + 'px  ' + o.s);
    });
    // pairwise text-on-text collision (real bbox intersection)
    for (let i = 0; i < ts.length; i++) for (let j = i + 1; j < ts.length; j++) {
      const a = ts[i], b = ts[j];
      const ox = Math.min(a.r, b.r) - Math.max(a.x, b.x);
      const oy = Math.min(a.bot, b.bot) - Math.max(a.y, b.y);
      if (ox > 1.2 && oy > 1.2) out.push('COLLIDE ' + ox.toFixed(1) + 'x' + oy.toFixed(1) + '  [' + a.s + '] <> [' + b.s + ']');
    }
  });
  const uniq = [...new Set(out)];
  document.getElementById('R').textContent = 'VB=' + VB + '  states=' + states.length + '\n' +
    (uniq.length ? uniq.join('\n') : 'NO OVERFLOW / NO COLLISION');
});
</script>
</body></html>
